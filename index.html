<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>My Mini Netflix</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://vjs.zencdn.net/7.22.1/video-js.css" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>🎬 My Mini Netflix</h1>
    <input type="text" id="search" placeholder="Tìm kiếm phim...">
  </header>

  <main>
    <section id="movie-grid">
      <!-- JS render poster grid -->
    </section>

    <section id="player-section" class="hidden">
      <button id="back-btn">⬅ Quay lại</button>
      <h2 id="movie-title"></h2>
      <video
        id="movie-player"
        class="video-js vjs-default-skin"
        controls
        preload="auto"
        width="1000"
        height="560"
      >
        <p>Trình duyệt của bạn không hỗ trợ video.</p>
      </video>
    </section>
  </main>

  <script src="https://vjs.zencdn.net/7.22.1/video.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
